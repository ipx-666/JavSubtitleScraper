<!DOCTYPE html>
<html>
<head><title>JavSubtitleScraper</title></head>
<body>
<div data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-input,emby-select,emby-checkbox">
<div data-role="content"><div class="content-primary">
<form class="JavSubtitleScraperConfigForm">
<div class="sectionTitle" style="font-weight:600;">&#23383;&#24149;&#35774;&#32622;</div>
<div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="targetLanguage">&#23383;&#24149;&#35821;&#35328;</label><select id="targetLanguage" is="emby-select"><option value="zh-CN">&#31616;&#20307;&#20013;&#25991; (zh-CN)</option></select><div class="fieldDescription">&#21482;&#19979;&#36733;&#25351;&#23450;&#35821;&#35328;&#23383;&#24149;&#12290;</div></div>
<label class="checkboxContainer"><input id="overwriteExistingSubtitles" type="checkbox" is="emby-checkbox"><span>&#35206;&#30422;&#24050;&#26377;&#23383;&#24149;</span></label>

<div class="sectionTitle" style="font-weight:600;margin-top:2em;">&#25163;&#21160;&#25195;&#25551;</div>
<label class="checkboxContainer"><input id="enableManualScan" type="checkbox" is="emby-checkbox" checked><span>&#20801;&#35768;&#25163;&#21160;&#25195;&#25551;</span></label>
<label class="checkboxContainer" style="margin-left:2em;"><input id="forceFullScan" type="checkbox" is="emby-checkbox"><span>&#24378;&#21046;&#20840;&#24211;&#37325;&#25195;</span></label>

<div class="sectionTitle" style="font-weight:600;margin-top:2em;">&#23450;&#26102;&#25195;&#25551;</div>
<label class="checkboxContainer"><input id="enableScheduledScan" type="checkbox" is="emby-checkbox"><span>&#21551;&#29992;&#23450;&#26102;&#25195;&#25551;</span></label>
<div id="scheduleOptions" style="margin-left:2em;">
  <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="scheduleMode">&#25195;&#25551;&#39057;&#29575;</label><select id="scheduleMode" is="emby-select"><option value="Daily">&#27599;&#22825;</option><option value="Weekly">&#27599;&#21608;</option></select></div>
  <div class="inputContainer" id="dailyOptions"><label class="inputLabel inputLabelUnfocused" for="dailyTime">&#27599;&#22825;&#25195;&#25551;&#26102;&#38388;</label><input id="dailyTime" type="time" step="1" is="emby-input"></div>
  <div id="weeklyOptions">
    <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="weeklyDay">&#27599;&#21608;&#26143;&#26399;</label><select id="weeklyDay" is="emby-select"><option value="Sunday">&#26143;&#26399;&#26085;</option><option value="Monday">&#26143;&#26399;&#19968;</option><option value="Tuesday">&#26143;&#26399;&#20108;</option><option value="Wednesday">&#26143;&#26399;&#19977;</option><option value="Thursday">&#26143;&#26399;&#22235;</option><option value="Friday">&#26143;&#26399;&#20116;</option><option value="Saturday">&#26143;&#26399;&#20845;</option></select></div>
    <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="weeklyTime">&#27599;&#21608;&#25195;&#25551;&#26102;&#38388;</label><input id="weeklyTime" type="time" step="1" is="emby-input"></div>
  </div>
</div>

<div class="sectionTitle" style="font-weight:600;margin-top:2em;">&#23186;&#20307;&#24211;&#20107;&#20214;</div>
<label class="checkboxContainer"><input id="enableLibraryEvents" type="checkbox" is="emby-checkbox" checked><span>&#30417;&#21548;&#23186;&#20307;&#24211;&#26032;&#22686;&#21644;&#26356;&#26032;</span></label>

<div class="sectionTitle" style="font-weight:600;margin-top:2em;">&#24615;&#33021;</div>
<div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="maxConcurrency">&#26368;&#22823;&#24182;&#21457;&#25968;</label><input id="maxConcurrency" type="number" min="1" max="8" value="4" is="emby-input"><div class="fieldDescription">&#40664;&#35748;&#24182;&#21457;&#25968;&#20026; 4&#12290;</div></div>
<button type="submit" is="emby-button" class="raised button-submit block">&#20445;&#23384;</button>
</form>
</div></div>
<script type="text/javascript">
(function () {
  var pluginId='1fbd6b47-0fa2-4f6e-bc3c-8e8c9b3d0f4d', page=document.querySelector('.pluginConfigurationPage');
  function setHeaderTitle() {
    var title=document.querySelector('.pageTitle');
    if (title) title.textContent='JavSubtitleScraper';
  }
  function update() {
    var manual=$('#enableManualScan',page).prop('checked'), scheduled=$('#enableScheduledScan',page).prop('checked'), weekly=$('#scheduleMode',page).val()==='Weekly';
    $('#forceFullScan',page).prop('disabled',!manual).closest('.checkboxContainer').toggleClass('disabled',!manual);
    $('#scheduleOptions',page).toggleClass('disabled',!scheduled).find('input,select').prop('disabled',!scheduled);
    $('#dailyOptions',page).toggle(scheduled&&!weekly); $('#weeklyOptions',page).toggle(scheduled&&weekly);
  }
  function load() {
    ApiClient.getPluginConfiguration(pluginId).then(function(c) {
      ['EnableManualScan','ForceFullScan','EnableScheduledScan','EnableLibraryEvents','OverwriteExistingSubtitles'].forEach(function(n) {
        var defaultValue=n==='EnableManualScan'||n==='EnableLibraryEvents';
        $('#'+n.charAt(0).toLowerCase()+n.slice(1),page).prop('checked',c[n]===undefined?defaultValue:!!c[n]);
      });
      $('#targetLanguage',page).val('zh-CN'); $('#maxConcurrency',page).val(c.MaxConcurrency||4);
      $('#scheduleMode',page).val(c.ScheduleMode||'Daily'); $('#dailyTime',page).val(c.DailyTime||'03:00:00'); $('#weeklyDay',page).val(c.WeeklyDay||'Sunday'); $('#weeklyTime',page).val(c.WeeklyTime||'03:00:00'); update();
    });
  }
  $(page).on('viewshow pageshow',function(){ setHeaderTitle(); window.setTimeout(setHeaderTitle, 100); load(); }).on('change','#enableManualScan,#enableScheduledScan,#scheduleMode',update).on('submit','.JavSubtitleScraperConfigForm',function(){
    var form=this; Dashboard.showLoadingMsg();
    ApiClient.getPluginConfiguration(pluginId).then(function(c){
      ['EnableManualScan','ForceFullScan','EnableScheduledScan','EnableLibraryEvents','OverwriteExistingSubtitles'].forEach(function(n){c[n]=$('#'+n.charAt(0).toLowerCase()+n.slice(1),form).prop('checked');});
      c.TargetLanguage='zh-CN'; c.MaxConcurrency=Math.max(1,Math.min(8,parseInt($('#maxConcurrency',form).val()||'4',10))); c.ScheduleMode=$('#scheduleMode',form).val()||'Daily'; c.DailyTime=$('#dailyTime',form).val()||'03:00:00'; c.WeeklyDay=$('#weeklyDay',form).val()||'Sunday'; c.WeeklyTime=$('#weeklyTime',form).val()||'03:00:00'; return ApiClient.updatePluginConfiguration(pluginId,c);
    }).then(function(r){Dashboard.processPluginConfigurationUpdateResult(r);}).finally(function(){Dashboard.hideLoadingMsg();}); return false;
  });
}());
</script>
</div>
</body>
</html>
